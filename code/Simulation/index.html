<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Platform Strategy Simulation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #eee; }
    input[type="number"] { width: 70px; }
    select { width: 150px; }
    .button { margin-top: 10px; padding: 6px 12px; }
  </style>
</head>
<body>

  <h1>Food-Delivery Platform Simulation</h1>
  <p>4 Groups. Each round: pick **Strategy** + **Price**, then click **Run Round**.</p>

  <table id="simTable">
    <thead>
      <tr>
        <th>Round</th>
        <th>Strategy</th>
        <th>Price</th>
        <th>Cust Start</th>
        <th>Cust End</th>
        <th>Profit</th>
        <th>Cumul Profit</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows will be created by JS -->
    </tbody>
  </table>

  <button class="button" onclick="initialize()">Start / Reset</button>

  <script>
    const strategies = [
      { name: "Do Nothing", delta: 0.00, multiplier: 1.0 },
      { name: "Discount", delta: 0.05, multiplier: 0.8 },
      { name: "Exclusive Deal", delta: 0.08, multiplier: 1.1 },
      { name: "Driver Subsidies", delta: 0.10, multiplier: 0.7 },
      { name: "Bundle Offer", delta: 0.06, multiplier: 1.0 },
      { name: "Loyalty Perks", delta: 0.04, multiplier: 1.2 }
    ];

    const baseMarket = 10000;
    const growth = 0.20;
    const threshold = 5000;
    const bonus = 0.10;

    let roundNum = 0;
    let marketSize = baseMarket;
    let groups = [];

    function initialize() {
      roundNum = 0;
      marketSize = baseMarket;
      groups = [];
      for (let i=0; i<4; i++){
        groups.push({ name: "Group "+String.fromCharCode(65+i), customers:0, cumulProfit:0 });
      }
      const tbody = document.querySelector("#simTable tbody");
      tbody.innerHTML = "";
      for (let r=1; r<=5; r++){
        const row = document.createElement("tr");
        row.dataset.round = r;
        row.innerHTML = `
          <td>${r}</td>
          <td><select>${ strategies.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('') }</select></td>
          <td><input type="number" value="5" min="0"/></td>
          <td>–</td><td>–</td><td>–</td><td>–</td>
        `;
        tbody.appendChild(row);
      }
      document.querySelector(".button").textContent = "Run Round 1";
    }

    function runNext() {
      roundNum++;
      if (roundNum > groups.length) return;
      marketSize = marketSize * (1 + growth);
      const largest = Math.max(...groups.map(g=>g.customers));
      const netMult = (largest > threshold) ? (1 + bonus) : 1;

      const tbody = document.querySelector("#simTable tbody");
      const row = tbody.querySelector(`tr[data-round="${roundNum}"]`);
      const sel = row.querySelector("select");
      const priceInput = row.querySelector("input");
      const strat = strategies[sel.value];
      const price = parseFloat(priceInput.value);

      const g = groups[roundNum-1];
      const custStart = g.customers;
      const custEnd = Math.round(custStart * (1 + strat.delta) * netMult + (marketSize * strat.delta));
      const profit = Math.round(custEnd * price * strat.multiplier);
      g.customers = custEnd;
      g.cumulProfit += profit;

      row.cells[3].textContent = custStart;
      row.cells[4].textContent = custEnd;
      row.cells[5].textContent = "$"+profit;
      row.cells[6].textContent = "$"+g.cumulProfit;

      if (roundNum < 5) {
        document.querySelector(".button").textContent = "Run Round " + (roundNum+1);
      } else {
        document.querySelector(".button").textContent = "Finished";
        document.querySelector(".button").disabled = true;
      }
    }

    document.querySelector(".button").addEventListener("click", () => {
      if (roundNum === 0 || roundNum < 5) {
        runNext();
      }
    });

    initialize();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Platform Strategy Simulation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #eee; }
    input[type="number"] { width: 70px; }
    select { width: 160px; }
    .button { margin-top: 10px; padding: 8px 16px; font-size: 16px; }
    .hidden { display: none; }
    #inputSection, #prevResultsSection { margin-top: 30px; }
  </style>
</head>
<body>

  <h1>Food-Delivery Platform Simulation</h1>
  <p>4 groups run platforms. Each round: pick a <strong>Strategy</strong> + <strong>Price</strong>. Previous round’s results will remain visible while you decide.</p>

  <div>
    <label>Number of rounds: <input id="numRounds" type="number" value="5" min="1" /></label>
    <button type="button" class="button" onclick="initialize()">Start / Reset</button>
  </div>

  <!-- Previous Round Results Section -->
  <div id="prevResultsSection" class="hidden">
    <h2>Previous Round Results – Round <span id="roundLabelPrev">0</span></h2>
    <table id="prevResultTable">
      <thead>
        <tr>
          <th>Group</th>
          <th>Cust Start</th>
          <th>Cust End</th>
          <th>Profit</th>
          <th>Cumul Profit</th>
        </tr>
      </thead>
      <tbody>
        <!-- filled by JS -->
      </tbody>
    </table>
  </div>

  <!-- Input Section -->
  <div id="inputSection">
    <h2>Round <span id="roundLabelInput">1</span>: Enter Strategy & Price</h2>
    <table id="inputTable">
      <thead>
        <tr>
          <th>Group</th>
          <th>Strategy</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <!-- filled by JS -->
      </tbody>
    </table>
    <button type="button" class="button" onclick="submitChoices()">Submit & Run Round</button>
  </div>

  <script>
    const strategies = [
      { name: "Do Nothing", delta: 0.00, multiplier: 1.0 },
      { name: "Discount", delta: 0.05, multiplier: 0.8 },
      { name: "Exclusive Deal", delta: 0.08, multiplier: 1.1 },
      { name: "Driver Subsidies", delta: 0.10, multiplier: 0.7 },
      { name: "Bundle Offer", delta: 0.06, multiplier: 1.0 },
      { name: "Loyalty Perks", delta: 0.04, multiplier: 1.2 }
    ];
    const baseMarket = 10000;
    const growthRate = 0.20;
    const networkThreshold = 5000;
    const networkBonusRate = 0.10;

    let roundNum = 0;
    let numRounds = 5;
    let marketSize = baseMarket;
    let groups = [];

    function initialize() {
      roundNum = 0;
      marketSize = baseMarket;
      numRounds = parseInt(document.getElementById("numRounds").value, 10) || 5;
      groups = [];
      for (let i = 0; i < 4; i++) {
        groups.push({
          name: "Group " + String.fromCharCode(65 + i),
          customers: 0,
          cumulProfit: 0
        });
      }
      // Hide previous results section until after first round
      document.getElementById("prevResultsSection").classList.add("hidden");
      buildInputTable();
      updateRoundLabels();
    }

    function buildInputTable() {
      const tbody = document.querySelector("#inputTable tbody");
      tbody.innerHTML = "";
      groups.forEach(g => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${g.name}</td>
          <td><select>${ strategies.map((s, i) => `<option value="${i}">${s.name}</option>`).join('') }</select></td>
          <td><input type="number" value="5" min="0" /></td>
        `;
        tbody.appendChild(row);
      });
    }

    function updateRoundLabels() {
      document.getElementById("roundLabelInput").textContent = roundNum + 1;
      document.getElementById("roundLabelPrev").textContent = roundNum;
    }

    function submitChoices() {
      if (roundNum >= numRounds) {
        alert("All rounds completed.");
        return;
      }

      roundNum++;
      marketSize = marketSize * (1 + growthRate);

      const largestCust = Math.max(...groups.map(g => g.customers));
      const netMult = (largestCust > networkThreshold ? (1 + networkBonusRate) : 1);

      const inputTbody = document.querySelector("#inputTable tbody");
      const prevTbody = document.querySelector("#prevResultTable tbody");
      prevTbody.innerHTML = "";   // clear previous

      groups.forEach((g, idx) => {
        const inputRow = inputTbody.rows[idx];
        const sel = inputRow.cells[1].querySelector("select");
        const priceInput = inputRow.cells[2].querySelector("input");
        const strat = strategies[ parseInt(sel.value, 10) ];
        const price = parseFloat(priceInput.value) || 0;

        const custStart = g.customers;
        const custEnd = Math.round(custStart * (1 + strat.delta) * netMult + (marketSize * strat.delta));
        const profit = Math.round(custEnd * price * strat.multiplier);

        g.customers = custEnd;
        g.cumulProfit += profit;

        const rowRes = document.createElement("tr");
        rowRes.innerHTML = `
          <td>${g.name}</td>
          <td>${custStart}</td>
          <td>${custEnd}</td>
          <td>$${profit.toLocaleString()}</td>
          <td>$${g.cumulProfit.toLocaleString()}</td>
        `;
        prevTbody.appendChild(rowRes);
      });

      // Show previous results
      document.getElementById("prevResultsSection").classList.remove("hidden");
      // Rebuild input for next round if any
      if (roundNum < numRounds) {
        buildInputTable();
        document.getElementById("roundLabelInput").textContent = roundNum + 1;
      } else {
        // If final round done, disable further input
        document.getElementById("inputSection").classList.add("hidden");
        alert("Simulation complete!");
      }
      updateRoundLabels();
    }

    window.onload = initialize;
  </script>

</body>
</html>

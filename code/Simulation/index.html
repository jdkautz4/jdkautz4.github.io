<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food-Delivery Platform Strategy Simulation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #eee; }
    input[type="number"] { width: 60px; }
  </style>
</head>
<body>

  <h1>Platform Strategy & Network Effects Simulation</h1>
  <p>Four groups run platforms. Each round, choose a strategy + subscription price. Click “Run Round” to see results.</p>

  <div>
    <label>Number of rounds: <input id="numRounds" type="number" value="5" min="1" /></label>
    <button onclick="initialize()">Initialize Simulation</button>
  </div>

  <div id="simulationArea"></div>

  <script>
    // Parameters
    const strategies = [
      { name: "Do Nothing", delta: 0.00, multiplier: 1.0 },
      { name: "Discount", delta: 0.05, multiplier: 0.8 },
      { name: "Exclusive Restaurant Deal", delta: 0.08, multiplier: 1.1 },
      { name: "Driver Subsidies", delta: 0.10, multiplier: 0.7 },
      { name: "Bundle Offer", delta: 0.06, multiplier: 1.0 },
      { name: "Loyalty Perks", delta: 0.04, multiplier: 1.2 }
    ];
    const baseMarketSize = 10000;
    const growthRate = 0.20;       // 20% growth each round
    const networkThreshold = 5000;
    const networkBonusRate = 0.10; // 10% extra growth once threshold crossed

    let currentRound = 0;
    let marketSizes = [];
    let platforms = [];  // one per group

    function initialize() {
      const numRounds = parseInt(document.getElementById("numRounds").value) || 5;
      currentRound = 0;
      marketSizes = [];
      platforms = [];
      for (let g = 0; g < 4; g++) {
        platforms.push({
          name: "Group " + String.fromCharCode(65 + g),
          customers: 0,
          cumulProfit: 0
        });
      }
      // setup initial market size
      marketSizes[0] = baseMarketSize;
      renderSimulationTable(numRounds);
    }

    function renderSimulationTable(numRounds) {
      const container = document.getElementById("simulationArea");
      container.innerHTML = "";
      const tbl = document.createElement("table");
      const header = tbl.insertRow();
      const cols = ["Round","Market Size","Net-Effect Multiplier"];
      for (let g = 0; g < platforms.length; g++) {
        cols.push(platforms[g].name + " Strategy","Price","Cust Start","Cust End","Profit","Cumul Profit");
      }
      cols.push("Run Round");
      cols.forEach(c => {
        const th = document.createElement("th");
        th.textContent = c;
        header.appendChild(th);
      });

      for (let r = 1; r <= numRounds; r++) {
        const row = tbl.insertRow();
        row.id = "roundRow" + r;
        // Market size cell
        const cellMarket = row.insertCell();
        cellMarket.textContent = "";
        // Net-Effect Multiplier cell
        row.insertCell().textContent = "";
        for (let g = 0; g < platforms.length; g++) {
          // Strategy select
          const strategyCell = row.insertCell();
          const sel = document.createElement("select");
          strategies.forEach((s, idx) => {
            const opt = document.createElement("option");
            opt.value = idx;
            opt.textContent = s.name;
            sel.appendChild(opt);
          });
          strategyCell.appendChild(sel);
          // Price input
          const priceCell = row.insertCell();
          const inp = document.createElement("input");
          inp.type = "number";
          inp.min = "0";
          inp.value = "5";
          priceCell.appendChild(inp);

          // Cust Start
          row.insertCell().textContent = "";
          // Cust End
          row.insertCell().textContent = "";
          // Profit
          row.insertCell().textContent = "";
          // Cumul Profit
          row.insertCell().textContent = "";
        }
        // Run button
        const runCell = row.insertCell();
        const btn = document.createElement("button");
        btn.textContent = "Run";
        btn.onclick = () => runRound(r, numRounds);
        runCell.appendChild(btn);
      }

      container.appendChild(tbl);
    }

    function runRound(r, totalRounds) {
      if (r === 1) {
        marketSizes[1] = marketSizes[0] * (1 + growthRate);
      } else {
        marketSizes[r] = marketSizes[r-1] * (1 + growthRate);
      }

      const row = document.getElementById("roundRow" + r);
      // Market size
      row.cells[1].textContent = Math.round(marketSizes[r]);
      // Compute net-effect multiplier (simple logic: if largest platform has > threshold)
      const largestCust = Math.max(...platforms.map(p => p.customers));
      let netMult = 1;
      if (largestCust > networkThreshold) {
        netMult += networkBonusRate;
      }
      row.cells[2].textContent = netMult.toFixed(2);

      // For each group
      for (let g = 0; g < platforms.length; g++) {
        const baseIdx = 3 + g*6;
        const sel = row.cells[baseIdx].firstChild;
        const strategy = strategies[parseInt(sel.value)];
        const price = parseFloat(row.cells[baseIdx+1].firstChild.value);
        const custStart = platforms[g].customers;
        const custEnd = Math.round(custStart * (1 + strategy.delta) * netMult + (marketSizes[r] * strategy.delta) );
        const profit = custEnd * price * strategy.multiplier;
        platforms[g].customers = custEnd;
        platforms[g].cumulProfit += profit;
        // update cells
        row.cells[baseIdx+2].textContent = custStart;
        row.cells[baseIdx+3].textContent = custEnd;
        row.cells[baseIdx+4].textContent = "$" + profit.toFixed(0);
        row.cells[baseIdx+5].textContent = "$" + platforms[g].cumulProfit.toFixed(0);
      }
    }
  </script>

</body>
</html>

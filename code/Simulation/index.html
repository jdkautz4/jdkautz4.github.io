<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Platform Strategy Simulation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #eee; }
    input[type="number"] { width: 70px; }
    select { width: 150px; }
    .button { margin-top: 10px; padding: 8px 16px; font-size: 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>Food-Delivery Platform Simulation</h1>
  <p>4 groups. You’ll complete one round at a time. View previous data → choose strategy & price → click “Run Round”.</p>

  <div>
    <label>Number of rounds: <input id="numRounds" type="number" value="5" min="1" /></label>
    <button class="button" onclick="initialize()">Start / Reset</button>
  </div>

  <table id="simTable">
    <thead>
      <tr>
        <th>Round #</th>
        <th>Group</th>
        <th>Strategy</th>
        <th>Price</th>
        <th>Cust Start</th>
        <th>Cust End</th>
        <th>Profit</th>
        <th>Cumul Profit</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows generated via JS -->
    </tbody>
  </table>

  <button class="button" onclick="runNext()">Run Next Round</button>

  <script>
    const strategies = [
      { name: "Do Nothing", delta: 0.00, multiplier: 1.0 },
      { name: "Discount", delta: 0.05, multiplier: 0.8 },
      { name: "Exclusive Deal", delta: 0.08, multiplier: 1.1 },
      { name: "Driver Subsidies", delta: 0.10, multiplier: 0.7 },
      { name: "Bundle Offer", delta: 0.06, multiplier: 1.0 },
      { name: "Loyalty Perks", delta: 0.04, multiplier: 1.2 }
    ];
    const baseMarket = 10000;
    const growthRate = 0.20;
    const networkThreshold = 5000;
    const networkBonusRate = 0.10;

    let roundNum = 0;
    let marketSize = baseMarket;
    let numRounds = 5;
    let groups = [];

    function initialize() {
      roundNum = 0;
      marketSize = baseMarket;
      numRounds = parseInt(document.getElementById("numRounds").value) || 5;
      groups = [];
      for (let i=0; i<4; i++){
        groups.push({ name: "Group "+String.fromCharCode(65+i), customers:0, cumulProfit:0 });
      }
      const tbody = document.querySelector("#simTable tbody");
      tbody.innerHTML = "";
      for (let r=1; r<=numRounds; r++){
        for (let g=0; g<groups.length; g++){
          const row = document.createElement("tr");
          row.dataset.round = r;
          row.dataset.group = groups[g].name;
          if (r > 1) {
            row.classList.add("hidden");
          }
          row.innerHTML = `
            <td>${r}</td>
            <td>${groups[g].name}</td>
            <td><select>${ strategies.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('') }</select></td>
            <td><input type="number" value="5" min="0"/></td>
            <td>–</td>
            <td>–</td>
            <td>–</td>
            <td>–</td>
          `;
          tbody.appendChild(row);
        }
      }
      document.querySelectorAll(".button")[1].textContent = "Run Round 1";
    }

    function runNext() {
      if (roundNum >= numRounds) {
        alert("All rounds completed.");
        return;
      }
      roundNum++;
      marketSize = marketSize * (1 + growthRate);

      const largestCust = Math.max(...groups.map(g=>g.customers));
      const netMult = (largestCust > networkThreshold) ? (1 + networkBonusRate) : 1;

      const tbody = document.querySelector("#simTable tbody");
      for (let gIndex=0; gIndex<groups.length; gIndex++){
        const row = tbody.querySelector(`tr[data-round="${roundNum}"][data-group="${groups[gIndex].name}"]`);
        row.classList.remove("hidden");
        const sel = row.cells[2].querySelector("select");
        const priceInput = row.cells[3].querySelector("input");
        const strat = strategies[parseInt(sel.value)];
        const price = parseFloat(priceInput.value) || 0;

        const custStart = groups[gIndex].customers;
        const custEnd = Math.round(custStart * (1 + strat.delta) * netMult + (marketSize * strat.delta));
        const profit = Math.round(custEnd * price * strat.multiplier);

        groups[gIndex].customers = custEnd;
        groups[gIndex].cumulProfit += profit;

        row.cells[4].textContent = custStart;
        row.cells[5].textContent = custEnd;
        row.cells[6].textContent = "$" + profit.toLocaleString();
        row.cells[7].textContent = "$" + groups[gIndex].cumulProfit.toLocaleString();
      }

      if (roundNum < numRounds) {
        document.querySelectorAll(".button")[1].textContent = "Run Round " + (roundNum+1);
      } else {
        document.querySelectorAll(".button")[1].textContent = "Finished";
      }
    }

    window.onload = initialize;
  </script>

</body>
</html>
